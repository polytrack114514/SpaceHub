<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>注册 — SpaceHub 星枢</title>
    <link href="https://fonts.googleapis.com/css2?family=Audiowide&family=Exo+2:wght@300;400;500;600;700;800&family=Michroma&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #060814;
            --text-primary: #dce8ff;
            --text-muted: #3a4868;
            --accent-blue: #5b8fff;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: var(--bg);
            color: var(--text-primary);
            font-family: 'Exo 2', system-ui, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .logo {
            font-family: 'Audiowide', sans-serif;
            font-size: 1.6rem;
            letter-spacing: 3px;
            color: var(--accent-blue);
            text-shadow: 0 0 20px rgba(91,143,255,0.4);
            margin-bottom: 32px;
            text-decoration: none;
        }
        .back-link {
            position: absolute; top: 24px; left: 24px;
            color: var(--text-muted); text-decoration: none;
            font-size: 0.85rem; transition: color 0.2s;
        }
        .back-link:hover { color: var(--accent-blue); }
        .hint {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <a class="back-link" href="./index.html">← 返回首页</a>
    <a class="logo" href="./index.html">SpaceHub 星枢</a>
    <div class="hint">注册功能请在主页进行</div>
    <script>
        window.location.href = './index.html';
    </script>
</body>
</html>
